name: Daily Digest

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/sentence_transformers
            ~/.cache/huggingface
          key: st-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: |
          if [ -s pipeline/requirements.txt ]; then
            pip install -r pipeline/requirements.txt
          fi

      - name: Run ingestion
        run: python -m pipeline.ingest
