name: Skim Personal Digest

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to send the personal digest to'
        required: true
        default: 'poudyal.sammit@gmail.com'

jobs:
  personal_digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      GEMINI_HIGH_DEMAND_THRESHOLD: "3"
      GEMINI_MODEL_RECOVERY_SECONDS: "60"
      LOG_LEVEL: INFO
      MAILTRAP_API_TOKEN: ${{ secrets.MAILTRAP_API_TOKEN }}
      MAILTRAP_SENDER_EMAIL: ${{ secrets.MAILTRAP_SENDER_EMAIL }}
      MAILTRAP_SENDER_NAME: Skim (Personal Preview)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/sentence_transformers
            ~/.cache/huggingface
          key: st-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run Skim pipeline in Personal Mode
        run: python -m pipeline.main --personal --email "${{ github.event.inputs.email }}"

      - name: Check pipeline health
        if: always()
        run: python -m pipeline.health_check

      - name: Send failure alert
        if: failure()
        run: python -m pipeline.alert_failure
